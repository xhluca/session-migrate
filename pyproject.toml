[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "session-migrate"
version = "0.5.0"
description = "Convert Claude, Codex, and Pi sessions to supported native agent targets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/xhluca/session-migrate"
Documentation = "https://github.com/xhluca/session-migrate/tree/main/docs"
Issues = "https://github.com/xhluca/session-migrate/issues"

[project.scripts]
session-migrate = "session_migrate.cli:main"
smigrate = "session_migrate.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/session_migrate"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
